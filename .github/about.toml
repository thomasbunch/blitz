# cargo-about settings for the release's THIRD-PARTY-NOTICES.txt. Keep
# `accepted` in step with the cargo-deny allowlist in ci.yml, which fails a
# pull request that brings in a crate under any other license.
accepted = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0", "ISC", "BSD-2-Clause", "BSD-3-Clause"]
# Every system a release ships for, so each one's notices cover it.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
