name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main always finish, so the cache is saved.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only allowlisted files are tracked
        run: |
          bad="$(git ls-files -ci --exclude-standard)"
          [ -z "$bad" ] || { echo "::error::tracked files excluded by .gitignore:"; echo "$bad"; exit 1; }
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
      # Releases only accept these licenses (cargo-about in release.yml).
      # Checking here fails the pull request that brings in a crate under
      # another license, or from anywhere but crates.io, instead of the
      # next release.
      - name: Licenses and sources
        run: |
          cat > "$RUNNER_TEMP/deny.toml" <<'EOF'
          [licenses]
          allow = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0"]

          [sources]
          unknown-registry = "deny"
          unknown-git = "deny"
          EOF
          # Licenses cover what ships: Windows, no dev dependencies.
          cargo deny --config "$RUNNER_TEMP/deny.toml" --locked --target x86_64-pc-windows-msvc --exclude-dev check licenses
          # Sources cover every crate CI builds, on every target.
          cargo deny --config "$RUNNER_TEMP/deny.toml" --locked check sources

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads rust-toolchain.toml. Must run before rust-cache, which keys on
      # the compiler version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The hook tests also run against the optimized blitz-hook.exe that
      # ships in releases.
      - if: runner.os == 'Windows'
        run: cargo test --release -p blitz --locked
