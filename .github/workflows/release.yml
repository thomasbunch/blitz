name: release

# A v* tag builds the Windows zip and installer and attaches them to a draft
# release. Running the workflow by hand builds the same files as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Microsoft's redistributable ConPTY, pinned by hash. 1.25 keeps
  # PowerShell's cursor in place after a resize; 1.24 does not.
  CONPTY_VERSION: 1.25.260710002-preview
  CONPTY_SHA256: 86edb1054c6f56d7377117ff75489197a5f095fe9835df3ad04c2ba9d826b114

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install

      - name: Version
        id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "blitz") | .version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        # A static CRT lets the exes run without the Visual C++ runtime.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p blitz

      - name: Fetch ConPTY
        run: |
          curl -fsSL -o conpty.nupkg "https://www.nuget.org/api/v2/package/Microsoft.Windows.Console.ConPTY/$CONPTY_VERSION"
          echo "$CONPTY_SHA256  conpty.nupkg" | sha256sum -c -
          unzip -q conpty.nupkg -d conpty

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about

      - name: Stage files
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          d="dist/blitz-$VERSION-windows-x64"
          mkdir -p "$d" out
          cp target/release/blitz.exe target/release/blitz-hook.exe "$d/"
          cp conpty/runtimes/win-x64/native/conpty.dll conpty/build/native/runtimes/x64/OpenConsole.exe "$d/"
          cp LICENSE "$d/LICENSE.txt"

          cat > "$RUNNER_TEMP/about.toml" <<'EOF'
          accepted = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0"]
          targets = ["x86_64-pc-windows-msvc"]
          ignore-build-dependencies = true
          ignore-dev-dependencies = true
          EOF
          cat > "$RUNNER_TEMP/about.hbs" <<'EOF'
          {{#each licenses}}
          ================================================================================
          {{name}}, used by:{{#each used_by}} {{crate.name}} {{crate.version}}{{/each}}

          {{{text}}}
          {{/each}}
          EOF

          n="$d/THIRD-PARTY-NOTICES.txt"
          {
            echo "blitz includes the following third-party software."
            echo
            echo "================================================================================"
            echo "conpty.dll and OpenConsole.exe: Microsoft.Windows.Console.ConPTY $CONPTY_VERSION"
            echo
            curl -fsSL https://raw.githubusercontent.com/microsoft/terminal/main/LICENSE
            echo
            echo "================================================================================"
            echo "Character width tables derived from the Unicode Character Database"
            echo
            curl -fsSL https://www.unicode.org/license.txt
            echo
            cargo about generate --config "$RUNNER_TEMP/about.toml" "$RUNNER_TEMP/about.hbs"
          } > "$n"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/blitz-${{ steps.v.outputs.version }}-windows-x64" -DestinationPath "out/blitz-${{ steps.v.outputs.version }}-windows-x64.zip"

      # PowerShell, because Git Bash rewrites ISCC's /D switches as paths.
      # Paths are absolute: ISCC resolves relative ones against the script.
      - name: Installer
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" "/DSrcDir=$PWD\dist\blitz-$env:VERSION-windows-x64" "/DOutDir=$PWD\out" .github\blitz.iss

      - name: Checksums
        working-directory: out
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blitz-windows
          path: out/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blitz-windows
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --title "blitz ${GITHUB_REF_NAME#v}" --notes ""
