name: release

# A v* tag builds the Windows zip and installer, the macOS app and the
# experimental Linux build, and attaches them to a draft release, once CI
# has passed on the tagged commit. Running the workflow by hand builds the
# same files as artifacts.
# Publishing the draft ships it: blitz offers the latest full release as an
# update, so the draft is not marked as a prerelease.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Microsoft's redistributable ConPTY, pinned by hash. 1.25 keeps
  # PowerShell's cursor in place after a resize; 1.24 does not. CI tests
  # this one too: keep ci.yml in step, which its lint job checks.
  CONPTY_VERSION: 1.25.260710002-preview
  CONPTY_SHA256: 86edb1054c6f56d7377117ff75489197a5f095fe9835df3ad04c2ba9d826b114

jobs:
  # All of CI on the tagged commit, whatever ran on main: publishing needs
  # it to pass.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the Version step can tell whether main has the tag.
          fetch-depth: 0
      - run: rustup toolchain install

      - name: Version
        id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "blitz") | .version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          # The release notes come from this section; publish takes it.
          if [ "$GITHUB_REF_TYPE" = tag ] && ! grep -qxE "## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for $version, such as \"## [$version] - $(date -u +%F)\""
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # .cargo/config.toml links the C runtime statically.
      - name: Build
        run: cargo build --release --locked -p blitz

      - name: Fetch ConPTY
        run: |
          curl -fsSL -o conpty.nupkg "https://www.nuget.org/api/v2/package/Microsoft.Windows.Console.ConPTY/$CONPTY_VERSION"
          echo "$CONPTY_SHA256  conpty.nupkg" | sha256sum -c -
          unzip -q conpty.nupkg -d conpty

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2

      - name: Stage files
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          d="dist/blitz-$VERSION-windows-x64"
          mkdir -p "$d" out
          cp target/release/blitz.exe target/release/blitz-hook.exe "$d/"
          cp conpty/runtimes/win-x64/native/conpty.dll conpty/build/native/runtimes/x64/OpenConsole.exe "$d/"
          cp LICENSE "$d/LICENSE.txt"

          n="$d/THIRD-PARTY-NOTICES.txt"
          {
            echo "blitz includes the following third-party software."
            echo
            echo "================================================================================"
            echo "conpty.dll and OpenConsole.exe: Microsoft.Windows.Console.ConPTY $CONPTY_VERSION"
            echo
            # The commit that added the license, which has not changed since.
            curl -fsSL https://raw.githubusercontent.com/microsoft/terminal/d4d59fa3395012ca37ba12665da4ec11c7dcf9cb/LICENSE
            echo
            echo "================================================================================"
            echo "Character width tables derived from the Unicode Character Database"
            echo
            curl -fsSL https://www.unicode.org/license.txt
            echo
            cargo about generate --locked --fail --config .github/about.toml .github/about.hbs
          } > "$n"

      - name: Zip
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: Compress-Archive -Path "dist/blitz-$env:VERSION-windows-x64" -DestinationPath "out/blitz-$env:VERSION-windows-x64.zip"

      # PowerShell, because Git Bash rewrites ISCC's /D switches as paths.
      # Paths are absolute: ISCC resolves relative ones against the script.
      - name: Installer
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # No fallback install: an installer fetched here would run next to
        # the staged files before they are hashed.
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not on this runner image" }
          & $iscc "/DAppVersion=$env:VERSION" "/DSrcDir=$PWD\dist\blitz-$env:VERSION-windows-x64" "/DOutDir=$PWD\out" .github\blitz.iss

      # The last published installer, for the smoke test to upgrade over,
      # checked against its release's SHA256SUMS as the updater checks what
      # it downloads. The token stays in this step, out of the installers'.
      - name: Last published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = "$env:RUNNER_TEMP\prev"
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --pattern SHA256SUMS.txt --dir $d
          if ($LASTEXITCODE) { throw "could not fetch the last published installer" }
          $exe = Get-ChildItem "$d\*-setup.exe"
          $line = Select-String -Path "$d\SHA256SUMS.txt" -SimpleMatch $exe.Name | Select-Object -First 1
          $want = if ($line) { ($line.Line -split '\s+')[0] }
          $got = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          if (-not $want -or $got -ne $want) { throw "$($exe.Name) does not match its SHA256SUMS.txt" }

      # What users get, run before anything is uploaded: the zip as unpacked,
      # then the installer over the last published release, the installed
      # blitz, its Explorer menu and the uninstaller. A broken installer would
      # also break the updater, which could then not fix itself.
      - name: Smoke test
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          $t = $env:RUNNER_TEMP
          $name = "blitz-$env:VERSION-windows-x64"
          # Waits for GUI-subsystem programs too, since the output is piped.
          function Run {
            $exe, $rest = $args
            & $exe @rest | Out-Host
            if ($LASTEXITCODE) { throw "$exe $rest exited with $LASTEXITCODE" }
          }
          # A session through `blitz debug run`, which must use the ConPTY
          # next to the exe; the counters it writes to BLITZ_TRACE say which
          # one ran. The text to wait for is not in the command line.
          function Session([string]$dir, [string]$tag) {
            Set-Content "$t\smoke-$tag.txt" "waitfor 20000 AMD64-smoke`nwaitexit 20000"
            $env:BLITZ_TRACE = "$t\smoke-$tag.json"
            Run "$dir\blitz.exe" debug run --cmd 'cmd /d /c echo %PROCESSOR_ARCHITECTURE%-smoke' --script "$t\smoke-$tag.txt" --timeout 60000
            Remove-Item Env:BLITZ_TRACE
            $counters = Get-Content "$t\smoke-$tag.json" -Raw
            if ($counters -notmatch '"inbox":false') { throw "$dir\blitz.exe ran on the system's ConPTY: $counters" }
            $v = (& "$dir\blitz.exe" --version | Out-String).Trim()
            if ($v -ne "blitz $env:VERSION") { throw "$dir\blitz.exe says $v" }
          }
          try {
            Expand-Archive "out\$name.zip" "$t\zip"
            $files = Get-ChildItem "$t\zip\$name" -Name
            $want = 'blitz.exe', 'blitz-hook.exe', 'conpty.dll', 'OpenConsole.exe', 'LICENSE.txt', 'THIRD-PARTY-NOTICES.txt'
            if (Compare-Object $want $files) { throw "the zip holds $($files -join ', ')" }
            foreach ($exe in 'blitz.exe', 'blitz-hook.exe') {
              $text = [IO.File]::ReadAllText("$t\zip\$name\$exe", [Text.Encoding]::ASCII)
              if ($text -match 'vcruntime140|api-ms-win-crt-') { throw "$exe needs the Visual C++ runtime" }
            }
            Session "$t\zip\$name" zip

            $app = "$env:LOCALAPPDATA\Programs\blitz"
            $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            Run (Get-ChildItem "$t\prev\*-setup.exe").FullName @quiet "/LOG=$t\install-prev.log"
            if (-not (Test-Path "$app\blitz.exe")) { throw "the last release did not install to $app" }
            Run "$PWD\out\$name-setup.exe" @quiet "/LOG=$t\install.log"
            Session $app installed
            $menu = 'Directory', 'Directory\Background', 'Drive' | ForEach-Object {
              "HKCU:\Software\Classes\$_\shell\blitz", "HKCU:\Software\Classes\$_\shell\blitz.window"
            }
            foreach ($key in $menu) {
              $flag = if ($key.EndsWith('.window')) { '--new-window ' } else { '' }
              $want = "`"$app\blitz.exe`" $flag--cwd `"%V`""
              $got = (Get-ItemProperty "$key\command").'(default)'
              if ($got -ne $want) { throw "$key runs $got" }
            }
            $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\blitz.lnk"
            if (-not (Test-Path $lnk)) { throw "no Start menu shortcut" }
            # Starting at sign-in only when asked for, and the uninstaller
            # removes it.
            $startup = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
            if ((Get-ItemProperty $startup).blitz) { throw "setup made blitz start at sign-in unasked" }
            Run "$PWD\out\$name-setup.exe" @quiet /MERGETASKS=startup "/LOG=$t\install-startup.log"
            $got = (Get-ItemProperty $startup).blitz
            if ($got -ne "`"$app\blitz.exe`"") { throw "sign-in starts $got" }
            # An update, as blitz runs it, keeps the choice; unticking it
            # removes it.
            Run "$PWD\out\$name-setup.exe" @quiet "/LOG=$t\install-update.log"
            $got = (Get-ItemProperty $startup).blitz
            if ($got -ne "`"$app\blitz.exe`"") { throw "after an update, sign-in starts $got" }
            Run "$PWD\out\$name-setup.exe" @quiet /MERGETASKS=!startup "/LOG=$t\install-nostartup.log"
            if ((Get-ItemProperty $startup).blitz) { throw "unticked, blitz still starts at sign-in" }
            Run "$PWD\out\$name-setup.exe" @quiet /MERGETASKS=startup "/LOG=$t\install-startup-again.log"

            # The uninstaller hands over to a copy of itself and returns.
            $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{1DA65EB8-E92D-465A-9531-C4B72BB72597}_is1'
            Run (Get-ItemProperty $entry).UninstallString.Trim('"') @quiet "/LOG=$t\uninstall.log"
            $deadline = (Get-Date).AddSeconds(60)
            while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
            $left = @($app, $lnk, $entry) + $menu | Where-Object { Test-Path $_ }
            if ($left) { throw "the uninstaller left $($left -join ', ')" }
            if ((Get-ItemProperty $startup).blitz) { throw "the uninstaller left blitz starting at sign-in" }
          } finally {
            Get-ChildItem "$t\*.log" | ForEach-Object { "::group::$($_.Name)"; Get-Content $_; '::endgroup::' }
          }

      - name: Checksums
        working-directory: out
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blitz-windows
          path: out/*
          if-no-files-found: error

  # One app for Apple silicon and Intel Macs. Signed ad hoc, not by a
  # developer ID, so the first start needs Open from the Finder's menu.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install

      - name: Version
        id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "blitz") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cargo build --release --locked -p blitz --target aarch64-apple-darwin
          cargo build --release --locked -p blitz --target x86_64-apple-darwin

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2

      - name: Bundle
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          d="dist/blitz-$VERSION-macos"
          app="$d/blitz.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" out
          for b in blitz blitz-hook; do
            lipo -create -output "$app/Contents/MacOS/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done

          # The icon, from the Windows one's largest image.
          png="$RUNNER_TEMP/icon.png"
          sips -s format png crates/blitz/icon/blitz.ico --out "$png"
          set="$RUNNER_TEMP/blitz.iconset"
          mkdir "$set"
          for n in 16 32 128 256 512; do
            sips -z "$n" "$n" "$png" --out "$set/icon_${n}x${n}.png"
            sips -z "$((n * 2))" "$((n * 2))" "$png" --out "$set/icon_${n}x${n}@2x.png"
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/blitz.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>blitz</string>
            <key>CFBundleDisplayName</key><string>blitz</string>
            <key>CFBundleIdentifier</key><string>io.github.thomasbunch.blitz</string>
            <key>CFBundleExecutable</key><string>blitz</string>
            <key>CFBundleIconFile</key><string>blitz</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

          cp LICENSE "$d/LICENSE.txt"
          {
            echo "blitz includes the following third-party software."
            echo
            echo "================================================================================"
            echo "Character width tables derived from the Unicode Character Database"
            echo
            curl -fsSL https://www.unicode.org/license.txt
            echo
            cargo about generate --locked --fail --config .github/about.toml .github/about.hbs
          } > "$d/THIRD-PARTY-NOTICES.txt"

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$d" "out/blitz-$VERSION-macos.zip"

      # The app as unzipped: both architectures, and a session through
      # `blitz debug run`. The text to wait for is not in the command line.
      - name: Smoke test
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          t="$RUNNER_TEMP/smoke"
          mkdir "$t"
          ditto -x -k "out/blitz-$VERSION-macos.zip" "$t"
          exe="$t/blitz-$VERSION-macos/blitz.app/Contents/MacOS/blitz"
          lipo "$exe" -verify_arch arm64 x86_64
          lipo "$(dirname "$exe")/blitz-hook" -verify_arch arm64 x86_64
          v="$("$exe" --version)"
          [ "$v" = "blitz $VERSION" ] || { echo "::error::the app says $v"; exit 1; }
          printf 'waitfor 20000 42-smoke\nwaitexit 20000\n' > "$t/script.txt"
          "$exe" debug run --cmd 'echo $((6 * 7))-smoke' --script "$t/script.txt" --timeout 60000

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blitz-macos
          path: out/*
          if-no-files-found: error

  # Built and smoke tested, but nobody has used it on a desktop yet.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install

      - name: Version
        id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "blitz") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked -p blitz

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          name="blitz-$VERSION-linux-x64-experimental"
          d="dist/$name"
          mkdir -p "$d" out
          cp target/release/blitz target/release/blitz-hook "$d/"
          cp LICENSE "$d/LICENSE.txt"
          {
            echo "blitz includes the following third-party software."
            echo
            echo "================================================================================"
            echo "Character width tables derived from the Unicode Character Database"
            echo
            curl -fsSL https://www.unicode.org/license.txt
            echo
            cargo about generate --locked --fail --config .github/about.toml .github/about.hbs
          } > "$d/THIRD-PARTY-NOTICES.txt"
          tar -C dist -czf "out/$name.tar.gz" "$name"

      - name: Smoke test
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          t="$RUNNER_TEMP/smoke"
          mkdir "$t"
          tar -C "$t" -xzf "out/blitz-$VERSION-linux-x64-experimental.tar.gz"
          exe="$t/blitz-$VERSION-linux-x64-experimental/blitz"
          v="$("$exe" --version)"
          [ "$v" = "blitz $VERSION" ] || { echo "::error::blitz says $v"; exit 1; }
          printf 'waitfor 20000 42-smoke\nwaitexit 20000\n' > "$t/script.txt"
          "$exe" debug run --cmd 'echo $((6 * 7))-smoke' --script "$t/script.txt" --timeout 60000

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blitz-linux
          path: out/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [ci, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blitz-*
          path: out
          merge-multiple: true
      # One list for every system's files; the Windows updater finds its
      # installer's sum by name.
      - name: Checksums
        working-directory: out
        run: rm -f SHA256SUMS.txt && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Signed provenance tying each file to this workflow and commit, which
      # a checksum in the same release cannot do. Check a download with
      # `gh attestation verify FILE --repo thomasbunch/blitz`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      # The notes are the version's section of CHANGELOG.md, up to the next
      # section or the links at the end. The draft can still be edited before
      # it is published.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v] - " '
            index($0, h) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no notes for $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "blitz $v" --notes-file "$RUNNER_TEMP/notes.md"
