[package]
name = "blitz"
description = "A fast terminal for running many coding agents side by side"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "blitz"
publish = false

[[bin]]
name = "blitz"
path = "src/main.rs"

# Console-subsystem helper that Claude Code runs as a hook.
[[bin]]
name = "blitz-hook"
path = "src/bin/blitz-hook.rs"

[dependencies]
vt = { path = "../vt" }
winit = "=0.30.13"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "gles", "wgsl"] }
swash = "=0.2.10"
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
pollster = "=1.0.1"

# The versions winit already uses, so AppKit is linked once.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.2"
block2 = "=0.5.1"
objc2-user-notifications = { version = "=0.2.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSString", "NSURL", "NSBundle", "NSProcessInfo", "NSThread", "NSValue"] }
objc2-app-kit = { version = "=0.2.2", features = ["NSAccessibility", "NSApplication", "NSDockTile", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSView", "NSColor", "NSAppearance", "NSEvent", "NSImage"] }

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_Networking_WinHttp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_TextServices",
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
]

# Shaders are compiled at build time; the app itself never links the
# shader compiler.
[target.'cfg(windows)'.build-dependencies.windows]
version = "=0.62.2"
features = ["Win32_Graphics_Direct3D_Fxc"]

[lints]
workspace = true
